name: Build immutable Batch-7 images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: batch7-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/threatlens-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record API digest
        shell: bash
        run: |
          echo "commit=${GITHUB_SHA}" > api-digest.txt
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/threatlens-api@${{ steps.build.outputs.digest }}" >> api-digest.txt
          cat api-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: batch7-api-digest-${{ github.sha }}
          path: api-digest.txt
          if-no-files-found: error
          retention-days: 30

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/threatlens-frontend:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record frontend digest
        shell: bash
        run: |
          echo "commit=${GITHUB_SHA}" > frontend-digest.txt
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/threatlens-frontend@${{ steps.build.outputs.digest }}" >> frontend-digest.txt
          cat frontend-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: batch7-frontend-digest-${{ github.sha }}
          path: frontend-digest.txt
          if-no-files-found: error
          retention-days: 30
