name: Batch 7 CI and DevSecOps

on:
  push:
    branches: [main, "batch7/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      THREATLENS_JWT_SECRET: ci-batch7-secret-that-is-long-enough-and-not-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.47.0
      - run: python -m pip install -c constraints-linux-py311.txt -r requirements.txt -r requirements-dev.txt
      - run: python -m scripts.verify_dependency_security
      - run: python -m scripts.generate_source_sbom
      - run: python -m ops.security.batch7_security_audit
      - run: python -m ruff check .
      - run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom-${{ github.sha }}
          path: sbom/source-dependencies-v0.14.0.cdx.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Build API image
        run: docker build --file Dockerfile --tag threatlens-api:${{ github.sha }} .

      # Keep a complete HIGH/CRITICAL report, including findings for which the
      # upstream distribution currently publishes no fixed package. This is
      # evidence, not a waiver: those findings remain visible for base-image
      # refresh/re-review instead of being silently discarded.
      - name: Record all API HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-api:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-api-all.json
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

      # Release gate: fail on any HIGH/CRITICAL vulnerability that has a vendor
      # fix available. Unfixed upstream OS findings are retained in the complete
      # evidence report above and are not misrepresented as remediable failures.
      - name: Block fixable API HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-api:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-api-blocking.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Upload API Trivy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-api-${{ github.sha }}
          path: |
            trivy-api-all.json
            trivy-api-blocking.json
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag threatlens-frontend:${{ github.sha }} ./frontend

      - name: Record all frontend HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-frontend:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-frontend-all.json
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

      - name: Block fixable frontend HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-frontend:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-frontend-blocking.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Upload frontend Trivy evidence
        # If an earlier API blocker stops the frontend scans, do not create a
        # misleading second failure merely because no frontend evidence exists.
        # If the frontend scan ran (including a blocking failure), preserve it.
        if: ${{ always() && hashFiles('trivy-frontend-all.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-frontend-${{ github.sha }}
          path: |
            trivy-frontend-all.json
            trivy-frontend-blocking.json
          if-no-files-found: error
          retention-days: 30
