name: Batch 7 CI and DevSecOps

on:
  push:
    branches: [main, "batch7/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: batch7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      THREATLENS_JWT_SECRET: ci-batch7-secret-that-is-long-enough-and-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.47.0
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m scripts.verify_dependency_security
      - run: python -m scripts.generate_source_sbom
      - run: python -m ops.security.batch7_security_audit
      - run: python -m ruff check .
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: source-sbom
          path: sbom/source-dependencies-v0.14.0.cdx.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: threatlens-api:batch7-ci
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: threatlens-api:batch7-ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
