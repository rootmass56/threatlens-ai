
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 110m;
    client_body_timeout 30s;
    keepalive_timeout 15s;

    # Resolve Compose service names through Docker embedded DNS at request
    # time. This prevents Nginx from crash-looping if service DNS is
    # temporarily unavailable during container startup/recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $threatlens_api_upstream "api:10000";


    # A first refresh after upgrading an older deployment may rebuild the governed
    # corpus while recovering its durable manifest. Keep this bounded admin route
    # connected without weakening ordinary API timeout limits.
    location = /api/v1/rag/knowledge/reindex {
        proxy_pass http://$threatlens_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://$threatlens_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        # Static frontend security headers live here only. API responses preserve
        # FastAPI's authoritative security-header set without Nginx duplication.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        try_files $uri $uri/ /index.html;
    }
}
