
[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens-ai"
version = "0.14.0"
description = "Operationally hardened SOC platform with observability, resilience, DevSecOps and grounded AI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit==1.66.1",
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn[standard]==0.53.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "pandas==2.2.3",
    "Pillow==13.0.0",
    "plotly==7.1.0",
    "reportlab==5.0.1",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
include = ["advanced_soc*", "api*", "app*", "attack*", "config*", "core*", "correlation*", "database*", "jobs*", "rag*", "rules*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

ignore = ["E501"]

[tool.setuptools.package-data]
"rules" = ["**/*.yml", "**/*.yaml", "**/*.log", "**/*.json", "**/*.jsonl", "**/*.csv"]
"config" = ["*.yml", "*.yaml"]

[tool.ruff.lint.per-file-ignores]
"scripts/verify_batch6_release.py" = ["E402", "E701", "E702"]
"scripts/verify_batch7_release.py" = ["E402"]
