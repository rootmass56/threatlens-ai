global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: threatlens
    release: v0.14.0

scrape_configs:
  - job_name: threatlens-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:10000"]

  - job_name: threatlens-postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: threatlens-redis
    static_configs:
      - targets: ["redis_exporter:9121"]
