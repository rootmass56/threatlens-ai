title: Explicit Credential Logon
id: fa29f0f9-0b9a-58de-a063-d67498ebeab1
detection_name: windows_explicit_credential_logon
version: 1
status: stable
enabled: true
kind: event
description: Detects Windows Event 4648 where a process attempts a logon using explicitly supplied credentials.
author: ThreatLens AI Detection Engineering
date: '2026-08-05'
modified: '2026-08-05'
tags:
- windows
- authentication
- credential-use
logsource:
  category: authentication
  product: windows
  service: security
  dataset: windows_security
detection:
  selections:
    explicit:
      event_type: explicit_credential_logon
  condition: explicit
severity: Medium
confidence: 0.82
message_template: Explicit credentials were used on {hostname} by {username}.
attack:
- technique_id: T1078
  technique: Valid Accounts
  tactic: Defense Evasion
  role: primary
  confidence: 0.9
  justification: Explicit credential use can indicate account misuse or lateral movement preparation.
falsepositives:
- RunAs usage by administrators.
- Approved service deployment tooling.
response:
  recommendation: Validate the initiating account, target account, process and destination system; investigate unexpected
    credential use.
  playbook: windows_explicit_credentials
risk:
  context_bonus: 5
lifecycle:
  owner: ThreatLens AI Detection Engineering
  reviewers:
  - SOC Engineering
  - Security Architecture
  last_reviewed: '2026-08-05'
  review_interval_days: 90
  changelog:
  - version: 1
    date: '2026-08-05'
    summary: Initial governed release of windows_explicit_credential_logon.
tuning:
  allowlists:
  - name: approved_deployment_accounts
    reason: Exclude approved deployment service accounts.
    enabled: true
    expressions:
      username|contains:
      - svc_deploy
  suppression:
    enabled: true
    group_by:
    - hostname
    - username
    timeframe_minutes: 30
    max_alerts: 1
  parameters: {}
fixtures:
  manifest: fixtures/windows_explicit_credential_logon/manifest.yml
