title: Suricata SSH Session Burst
id: c20dbc45-bd13-5c56-8ee5-da39fb5b0133
detection_name: suricata_ssh_bruteforce
version: 1
status: stable
enabled: true
kind: threshold
description: Detects repeated SSH session telemetry from one source in a short period.
author: ThreatLens AI Detection Engineering
date: '2026-08-05'
modified: '2026-08-05'
tags:
- suricata
- ssh
- authentication
logsource:
  category: network
  product: suricata
  service: eve
  dataset: suricata_eve
detection:
  selections:
    ssh:
      event_type: ssh_session
  condition: ssh
  threshold:
    selection: ssh
    count: 6
    group_by:
    - source_ip
    timeframe_minutes: 5
severity: High
confidence: 0.86
message_template: '{event_count} SSH sessions were observed from {source_ip} within five minutes.'
attack:
- technique_id: T1110.001
  technique: 'Brute Force: Password Guessing'
  tactic: Credential Access
  role: primary
  confidence: 0.9
  justification: A rapid SSH session burst from one source can indicate password guessing.
falsepositives:
- Approved vulnerability scanning.
- Bastion health checks.
response:
  recommendation: Review SSH authentication logs, block unauthorized sources and enforce keys or MFA.
  playbook: network_ssh_bruteforce
risk:
  context_bonus: 5
lifecycle:
  owner: ThreatLens AI Detection Engineering
  reviewers:
  - SOC Engineering
  - Security Architecture
  last_reviewed: '2026-08-05'
  review_interval_days: 90
  changelog:
  - version: 1
    date: '2026-08-05'
    summary: Initial governed release of suricata_ssh_bruteforce.
tuning:
  allowlists:
  - name: approved_scanners
    reason: Exclude approved vulnerability scanners.
    enabled: true
    expressions:
      source_ip|in:
      - 192.0.2.10
  suppression:
    enabled: true
    group_by:
    - source_ip
    timeframe_minutes: 15
    max_alerts: 1
  parameters: {}
fixtures:
  manifest: fixtures/suricata_ssh_bruteforce/manifest.yml
